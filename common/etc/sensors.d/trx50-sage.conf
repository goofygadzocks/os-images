# lm_sensors configuration for ASUS Pro WS TRX50-SAGE WIFI A
# Super I/O: Nuvoton NCT6799D-R  (probed as "NCT6796D-S/NCT6799D-R")
#
# Scope: this file ONLY tidies the generic Super I/O chip (nct6799).
# The good board sensors -- CPU / CPU Package / VRM_E / VRM_W temps and
# the VRM heatsink fan RPMs -- already come named from the EC driver
# (asusec-isa-0000) and need no config. The CPU die temp comes from
# k10temp. So all this does is:
#   * name the fans that ONLY appear on the Super I/O (AIO pump, intakes)
#   * hide the two VRM fans that are duplicated from the EC
#   * silence the uncalibrated voltage rails (the wall of bogus ALARMs)
#   * hide unconnected thermistor inputs and absent PCH sensors
#
# Install (Silverblue /etc is writable and survives rpm-ostree updates):
#   sudo install -m 0644 trx50-sage.conf /etc/sensors.d/trx50-sage.conf
#   sensors            # re-reads config on every run; no -s needed

chip "nct6799-*"

    ## ---- Fans -------------------------------------------------------
    ## fanN is referenced directly by the name shown in `sensors`.
    label fan1 "Memory Fan"
    label fan2 "AIO Pump"
    label fan3 "Intake Fan 1"
    label fan4 "Intake Fan 2"
    label fan5 "Intake Fan 3"
    label fan6 "Drive Fans"

    ## ---- Voltages ---------------------------------------------------
    ## No factory min/max and no per-rail scaling are defined for this
    ## board, so every rail reads raw and trips a meaningless ALARM.
    ## Not worth hand-mapping 18 rails when nothing here is load-bearing.
    ## (FYI: in0 ~= Vcore if you ever want just that one -- un-ignore it
    ##  and add a `compute`/limits line.)
    ignore in0
    ignore in1
    ignore in2
    ignore in3
    ignore in4
    ignore in5
    ignore in6
    ignore in7
    ignore in8
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14
    ignore in15
    ignore in16
    ignore in17

    ## ---- Temperatures -----------------------------------------------
    ## IMPORTANT: tempN -> friendly-name mapping is the one thing that can
    ## differ between kernels/boards. The numbering below assumes the
    ## display order you saw. VERIFY before trusting the ignores:
    ##
    ##   # find which hwmonN is the nct6799:
    ##   for f in /sys/class/hwmon/*/name; do echo "$(dirname $f) $(cat $f)"; done
    ##   # then dump its temp labels in order:
    ##   grep -H . /sys/class/hwmon/hwmonN/temp*_label
    ##
    ## Adjust the tempN numbers below if your dump disagrees.

    # temp1 = SYSTIN  -> real motherboard ambient. Keep, renamed.
    label temp1 "Motherboard"

    # Everything else here is either redundant with k10temp/asusec, an
    # unconnected thermistor reading noise, or an absent PCH sensor.
    ignore temp2    # CPUTIN          (CPU temp covered by k10temp / asusec)
    ignore temp3    # AUXTIN0  (~58C) (unlabeled -- un-ignore to investigate)
    ignore temp4    # AUXTIN1
    ignore temp5    # AUXTIN2         (floating)
    ignore temp6    # AUXTIN3         (floating, negative)
    ignore temp7    # AUXTIN4
    ignore temp8    # PECI/TSI Agent0 (covered by k10temp)
    ignore temp9    # AUXTIN5         (floating -- the bogus +94C)
    ignore temp10   # PCH_CHIP_CPU_MAX_TEMP (absent on this platform)
    ignore temp11   # PCH_CHIP_TEMP         (absent)
    ignore temp12   # PCH_CPU_TEMP          (absent)
    ignore temp13   # TSI0_TEMP       (covered by k10temp)
    ignore intrusion0
    ignore intrusion1
    ignore beep_enable
    
    ## Optional cosmetic cleanups for other chips (uncomment if wanted):
    # chip "k10temp-*"
    #     label temp1 "CPU (Tctl)"
