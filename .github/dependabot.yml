version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # cosign-installer v4 installs cosign v3, whose new signature format
      # podman/bootc may not verify — test before taking that jump
      - dependency-name: sigstore/cosign-installer
        update-types: ["version-update:semver-major"]
