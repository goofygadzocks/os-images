name: build

on:
  schedule:
    - cron: "0 10 * * *" # daily ~04:00 America/Denver (03:00 during DST)
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: os

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [virt, dumper]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Raw + rechunked copies of the image don't fit in the runner's default free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Rootless login is what cosign uses; rootful login (own authfile, so it
      # does not take over the rootless one) is what podman push uses
      - name: Log in to GHCR
        uses: redhat-actions/podman-login@4934294ad0449894bcd1e9f191899d7292469603 # v1.7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR (root)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            --authfile /root/ghcr-auth.json \
            ghcr.io -u "${{ github.actor }}" --password-stdin

      # Rootful so the rechunk container can read the image from /var/lib/containers
      - name: Build ${{ matrix.variant }}
        run: |
          sudo podman build \
            --target ${{ matrix.variant }} \
            -t localhost/${IMAGE_NAME}:${{ matrix.variant }}-raw \
            -f Containerfile .

      # Re-split into per-package layers so clients only download what changed
      - name: Rechunk
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            rpm-ostree compose build-chunked-oci \
              --bootc --format-version=1 \
              --from localhost/${IMAGE_NAME}:${{ matrix.variant }}-raw \
              --output containers-storage:${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ matrix.variant }}

      - name: Push
        run: |
          sudo podman push \
            --authfile /root/ghcr-auth.json \
            --digestfile /tmp/digest \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ matrix.variant }}
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
